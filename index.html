    <script>
      // Aggressive fix for "Cannot set property fetch of #<Window> which has only a getter"
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          value: originalFetch,
          writable: true,
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Could not redefine fetch, it might already be non-configurable.');
      }
    </script>
